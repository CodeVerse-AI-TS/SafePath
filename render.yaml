# Render Blueprint — Free one-click deploy of SafePath
services:
  - type: web
    name: safepath
    runtime: node
    plan: free
    buildCommand: npm install && npm run bootstrap
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SAFEPATH_DB
        value: "./data/safepath.db"
      - key: SAFEPATH_UA
        value: "SafePath/1.0 (contact: prajwalb1965@gmail.com)"
      - key: SAFEPATH_CORS
        value: "*"
